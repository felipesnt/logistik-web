<script>
(function(){
  var views=[].slice.call(document.querySelectorAll('.view'));
  function show(k){
    if(!views.some(function(v){return v.dataset.view===k})) k='overview';
    views.forEach(function(v){v.classList.toggle('active',v.dataset.view===k)});
    if(location.hash!=='#'+k) history.replaceState(null,'','#'+k);
    document.title=(k==='overview'?'':document.querySelector('.view.active svg').getAttribute('aria-label')+' — ')+'Painel Logistik (protótipo)';
    window.scrollTo(0,0);
  }
  document.addEventListener('click',function(e){
    var n=e.target.closest('[data-nav]'); if(n){show(n.getAttribute('data-nav'));return;}
    var t=e.target.closest('[data-tab]'); if(t) tab(t);
  });
  document.addEventListener('keydown',function(e){
    if(e.key!=='Enter'&&e.key!==' ')return;
    var el=e.target.closest('[data-nav],[data-tab]'); if(!el)return; e.preventDefault(); el.dispatchEvent(new MouseEvent('click',{bubbles:true}));
  });
  function tab(t){
    var view=t.closest('.view'), key=t.getAttribute('data-tab');
    view.querySelectorAll('[data-tab]').forEach(function(x){
      var on=x===t, bg=x.querySelector('.tab-bg'), tx=x.querySelector('.tab-tx');
      bg.setAttribute('fill-opacity',on?'1':'0'); tx.setAttribute('font-weight',on?'600':'500'); tx.setAttribute('fill',on?'#0F2233':'#5F7285');
    });
    view.querySelectorAll('[data-pane]').forEach(function(p){p.style.display=p.getAttribute('data-pane')===key?'':'none'});
  }
  var tip=document.getElementById('tip');
  function place(e){tip.style.left=Math.min(window.innerWidth-300,e.clientX+14)+'px';tip.style.top=(e.clientY+16)+'px'}
  document.addEventListener('mouseover',function(e){var h=e.target.closest('[data-tip]'); if(h){tip.textContent=h.getAttribute('data-tip');tip.classList.add('on');place(e)}});
  document.addEventListener('mousemove',function(e){if(tip.classList.contains('on'))place(e)});
  document.addEventListener('mouseout',function(e){if(e.target.closest('[data-tip]'))tip.classList.remove('on')});
  window.addEventListener('hashchange',function(){show(location.hash.slice(1))});
  show(location.hash.slice(1)||'overview');
})();
</script>
</body>
</html>
